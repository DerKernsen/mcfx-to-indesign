name: Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and build tooling
        run: python -m pip install . pyinstaller==6.22.3
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build Windows GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MCFX-to-InDesign mcfx_gui.py
      - name: Package executable and licenses
        run: python scripts/package_windows.py dist/MCFX-to-InDesign.exe release/mcfx-to-indesign-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/mcfx-to-indesign-windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
