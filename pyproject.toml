[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcfx-to-indesign"
version = "0.1.0"
description = "Experimental converter for CEWE MCFX photo books to editable InDesign layouts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["Pillow>=10", "reportlab>=4"]

[project.scripts]
mcfx-to-indesign = "mcfx_to_indesign:main"

[tool.setuptools]
py-modules = ["mcfx_to_indesign"]
